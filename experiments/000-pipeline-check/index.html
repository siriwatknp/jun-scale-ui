<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>000 · Pipeline check</title>
    <style>
      :root {
        --unit: 4px;
        --space-2: calc(var(--unit) * 2);
        --space-4: calc(var(--unit) * 4);
        --text-body: 16px;
      }
      body {
        margin: 0;
        padding: var(--space-4);
        font-family: system-ui, sans-serif;
        font-size: var(--text-body);
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 80px;
      }
      .box {
        padding: var(--space-4);
        background: #f1f1f4;
        border-radius: var(--space-2);
      }
      .wrong {
        padding: 15px;
      }
    </style>
    <script src="../../tools/annotate.js" defer></script>
  </head>
  <body>
    <p>Checks that screenshots and annotations work. The second box is wrong on purpose.</p>
    <div class="stack">
    <div
      class="box"
      data-annotate-name=".box"
      data-annotate="padding-top:--space-4 border-top-left-radius:--space-2 font-size:--text-body"
    >
      Matches its tokens
    </div>
    <div class="box wrong" data-annotate-name=".box.wrong" data-annotate="padding-top:--space-4">
      Padding is off by one pixel
    </div>
    </div>
  </body>
</html>
